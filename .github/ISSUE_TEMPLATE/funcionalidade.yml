name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do controle de mudanças isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O solicitante consegue...
        - [ ] O sistema impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Interface (src/main.js, index.html)
        - Regras de mudança (src/mudancas.js)
        - Armazenamento (src/armazenamento.js)
        - Documentação / PGCS
        - Pipeline / .github
    validations:
      required: true
